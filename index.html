<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wilhelmsifter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;800&family=JetBrains+Mono:wght@400&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0e0a;
    color: #e8f5e8;
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .center {
    text-align: center;
    padding: 2rem;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 2.5rem;
    font-weight: 800;
    color: #4ade80;
    letter-spacing: -0.02em;
    margin-bottom: 0.5rem;
  }

  .sub {
    color: #4a5e4a;
    font-size: 13px;
    margin-bottom: 3rem;
  }

  a {
    display: inline-block;
    color: #e8f5e8;
    text-decoration: none;
    font-size: 14px;
    border: 1px solid #2a382a;
    border-radius: 6px;
    padding: 0.75rem 1.5rem;
    transition: border-color 0.2s, color 0.2s;
  }

  a:hover {
    border-color: #4ade80;
    color: #4ade80;
  }

  .arrow { margin-left: 0.5rem; }
</style>
</head>
<body>
<div class="center">
  <h1>Sifter's Toolkit</h1>
  <p class="sub">tools & calculators</p>
  <a href="/noodle-cart-calc.html">Noodle Cart Calculator <span class="arrow">→</span></a>
</div>
</body>
</html>
