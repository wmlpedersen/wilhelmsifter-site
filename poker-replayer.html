<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Håndreplay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
*{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: oval table as the hero, step controls under it, hand log + import/share in a side column (stacks on phones). */
:root{
  --bg:#e9eeeb; --panel:#f8faf9; --ink:#17201b; --muted:#56645c; --line:#cfd8d3;
  --accent:#1d6b52; --accent-ink:#ffffff;
  /* table is a physical object: same look in both themes */
  --felt:#2a6b52; --felt-2:#173f31; --rail:#2b211b; --plate:#121715; --plate-ink:#eef3f0;
  --brass:#d9a63a; --card:#fbfaf5; --back1:#8c2f2f; --back2:#6e2222;
  --s-s:#1a1a1a; --s-h:#c42b2b; --s-d:#1f5fb8; --s-c:#1f7d3c;
  --t-fold:#59645e; --t-pass:#2c6a9a; --t-aggr:#a8402e;
  --a-check:#5d7f96; --a-call:#2f7fc1; --a-bet:#d9822b; --a-raise:#c9402e; --a-allin:#8b2fc0; --a-post:#4b5a52; --a-win:#d9a63a;
  --font-ui:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --panel:#171e1b; --ink:#e3eae6; --muted:#93a39a; --line:#2a3530;
  --accent:#4fb08c; --accent-ink:#06130d; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1412; --panel:#171e1b; --ink:#e3eae6; --muted:#93a39a; --line:#2a3530;
  --accent:#4fb08c; --accent-ink:#06130d; color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}
.meta{font-family:var(--font-num);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:1px 8px;margin-left:8px;vertical-align:2px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px;align-items:start}
@media (max-width:880px){.main{grid-template-columns:minmax(0,1fr)}}
.stage{min-width:0;display:flex;flex-direction:column;gap:12px}

/* table */
.table{position:relative;width:100%;aspect-ratio:16/10}
.felt{position:absolute;inset:10% 7%;border-radius:50%;background:radial-gradient(ellipse at 50% 42%,var(--felt) 0%,var(--felt-2) 78%);
  border:clamp(7px,1.3vw,13px) solid var(--rail);box-shadow:inset 0 0 0 2px rgba(255,255,255,.07),inset 0 8px 30px rgba(0,0,0,.35),0 10px 26px rgba(0,0,0,.22)}
@media (max-width:560px){.table{aspect-ratio:4/5}.felt{inset:7% 10%}}
.seat{position:absolute;transform:translate(-50%,-50%);width:clamp(80px,21%,150px);display:flex;flex-direction:column;align-items:center;transition:opacity .2s}
.seat.folded{opacity:.42}
.hole{display:flex;gap:2px;height:calc(clamp(24px,4.2vw,40px)*1.4);margin-bottom:-10px;position:relative;z-index:1}
.plate{width:100%;background:var(--plate);color:var(--plate-ink);border-radius:9px;padding:11px 6px 6px;text-align:center;border:2px solid transparent;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.seat.active .plate{border-color:var(--brass);box-shadow:0 0 0 3px rgba(217,166,58,.28),0 3px 10px rgba(0,0,0,.3)}
.seat.hero .plate{background:#1b2420}
.name{font-weight:600;font-size:clamp(11px,1.6vw,14px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack{font-family:var(--font-num);font-size:clamp(10px,1.45vw,13px);color:var(--brass);font-variant-numeric:tabular-nums;white-space:nowrap}
.stack .pos{color:#9fb0a7;margin-right:4px;font-family:var(--font-ui);font-weight:600;letter-spacing:.04em}
.tag{margin-top:5px;font-size:clamp(11px,1.5vw,14px);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#fff;border-radius:6px;padding:2px 9px;white-space:nowrap;min-height:1.3em;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.tag:empty{visibility:hidden}
.tag.fold{background:var(--t-fold);opacity:.85}.tag.check{background:var(--a-check)}.tag.call{background:var(--a-call)}.tag.bet{background:var(--a-bet)}.tag.raise{background:var(--a-raise)}.tag.allin{background:var(--a-allin)}.tag.post{background:var(--a-post)}.tag.win{background:var(--a-win);color:#1b1408}
.desc{margin-top:3px;font-size:clamp(10px,1.3vw,12px);color:#e9efe9;background:rgba(0,0,0,.45);border-radius:5px;padding:1px 6px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.desc:empty{display:none}
.betpos{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;font-family:var(--font-num);font-size:clamp(11px,1.5vw,14px);font-weight:600;color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums;z-index:2;--ac:var(--a-post)}
.betpos.check{--ac:var(--a-check)}.betpos.call{--ac:var(--a-call)}.betpos.bet{--ac:var(--a-bet)}.betpos.raise{--ac:var(--a-raise)}.betpos.allin{--ac:var(--a-allin)}.betpos.win{--ac:var(--a-win)}
.chips{display:flex;flex-direction:column-reverse;align-items:center}
.chips b{display:block;width:clamp(14px,2vw,19px);height:clamp(5px,.7vw,7px);border-radius:50%;background:var(--ac);border:1.5px dashed rgba(255,255,255,.85);box-sizing:border-box;margin-top:-2px;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.betpos span{background:rgba(0,0,0,.6);border:1.5px solid var(--ac);border-radius:6px;padding:1px 6px}
.fly{position:absolute;transform:translate(-50%,-50%);z-index:3;pointer-events:none}
.dbtn{position:absolute;transform:translate(-50%,-50%);width:clamp(16px,2.2vw,22px);height:clamp(16px,2.2vw,22px);border-radius:50%;background:#f4f1e8;color:#1b1b1b;font-weight:700;font-size:clamp(9px,1.2vw,12px);display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;max-width:62%}
.pot{font-family:var(--font-num);font-size:clamp(11px,1.6vw,14px);color:#fff;background:rgba(0,0,0,.35);border-radius:99px;padding:2px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.board{display:flex;gap:4px}
.result{font-size:clamp(11px,1.5vw,13px);color:#fff;background:rgba(0,0,0,.55);border-radius:8px;padding:5px 10px;text-align:center;line-height:1.35}
.result:empty{display:none}
.result b{color:var(--brass)}

/* cards */
.card{width:clamp(24px,4.2vw,40px);aspect-ratio:5/7;background:var(--card);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:700;line-height:.95;font-size:clamp(11px,1.8vw,17px);box-shadow:0 2px 4px rgba(0,0,0,.35);font-family:var(--font-ui)}
.board .card{width:clamp(28px,5.4vw,50px);font-size:clamp(13px,2.2vw,21px)}
.card.s{color:var(--s-s)}.card.h{color:var(--s-h)}.card.d{color:var(--s-d)}.card.c{color:var(--s-c)}
.card.back{background:repeating-linear-gradient(45deg,var(--back1) 0 4px,var(--back2) 4px 8px);border:2px solid var(--card)}
.card.empty{background:transparent;border:1.5px dashed rgba(255,255,255,.2);box-shadow:none}

/* narration + controls */
.narr{font-size:18px;font-weight:600;min-height:1.4em;text-align:center;text-wrap:balance;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px}
.narr2{font-family:var(--font-num);font-size:13px;color:var(--muted);text-align:center;min-height:1.2em;margin-top:-6px;font-variant-numeric:tabular-nums}
.narr2 .plus{color:var(--a-bet);font-weight:600}
.vb{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#fff;border-radius:6px;padding:3px 9px;background:var(--a-post)}
.vb.check{background:var(--a-check)}.vb.call{background:var(--a-call)}.vb.bet{background:var(--a-bet)}.vb.raise{background:var(--a-raise)}.vb.allin{background:var(--a-allin)}.vb.fold{background:var(--t-fold)}.vb.win{background:var(--a-win);color:#1b1408}.vb.street{background:var(--accent);color:var(--accent-ink)}
.lb{display:inline-block;min-width:44px;text-align:center;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:1px;background:var(--a-post)}
.lb.check{background:var(--a-check)}.lb.call{background:var(--a-call)}.lb.bet{background:var(--a-bet)}.lb.raise{background:var(--a-raise)}.lb.allin{background:var(--a-allin)}.lb.fold{background:var(--t-fold)}.lb.win{background:var(--a-win);color:#1b1408}
.pot:empty{display:none}
.result:has(.empty-msg){background:none;padding:0}
.empty-msg{color:#e9efe9;font-size:clamp(13px,1.8vw,16px);text-align:center;background:rgba(0,0,0,.35);border-radius:8px;padding:8px 14px}
.controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px}
button{font-family:var(--font-ui);font-size:14px;font-weight:600;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,li:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button svg{width:16px;height:16px;fill:currentColor}
.scrubrow{display:flex;align-items:center;gap:10px}
.scrubrow input{flex:1;min-width:0;accent-color:var(--accent)}
.count{font-family:var(--font-num);font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

/* side */
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.box h2,.box summary{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.box summary{cursor:pointer;margin:0}
details[open] summary{margin-bottom:10px}
#log{list-style:none;margin:0;padding:0;max-height:330px;overflow:auto;font-size:14px}
#log .st{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:8px 6px 2px}
#log li.step{padding:4px 6px;border-radius:6px;cursor:pointer;font-variant-numeric:tabular-nums}
#log li.step:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
#log li.step.cur{background:var(--accent);color:var(--accent-ink)}
textarea{width:100%;box-sizing:border-box;min-height:150px;font-family:var(--font-num);font-size:11.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
label.chk{display:flex;gap:7px;align-items:center;font-size:14px;margin-top:6px;cursor:pointer}
label.chk input{accent-color:var(--accent);width:16px;height:16px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0;line-height:1.4}
.err{color:#c0392b;font-size:13px;margin-top:6px}
.err:empty{display:none}
#shareOut{width:100%;box-sizing:border-box;font-family:var(--font-num);font-size:11px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px;margin-top:8px}
#shareOut[hidden]{display:none}
.warn{font-size:13px;color:var(--muted);text-align:center}
.warn:empty{display:none}
@media (prefers-reduced-motion:reduce){.seat{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Håndreplay<span class="badge" id="sharedBadge" hidden>Delt hånd</span></h1>
    <div class="meta" id="meta"></div>
  </header>
  <div class="main">
    <section class="stage">
      <div class="table" id="table" aria-label="Pokerbord">
        <div class="felt"></div>
        <div class="center"><div class="pot" id="pot"></div><div class="board" id="board"></div><div class="result" id="result"></div></div>
      </div>
      <div class="narr" id="narr" aria-live="polite"></div>
      <div class="narr2" id="narr2"></div>
      <div class="controls">
        <button id="bStart" aria-label="Til start"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button id="bPrev" aria-label="Forrige steg"><svg viewBox="0 0 24 24"><path d="M17 5v14L6 12z"/></svg>Forrige</button>
        <button id="bPlay" class="primary"><svg viewBox="0 0 24 24" id="playIco"><path d="M7 5v14l12-7z"/></svg><span id="playTxt">Spill av</span></button>
        <button id="bNext" aria-label="Neste steg">Neste<svg viewBox="0 0 24 24"><path d="M7 5v14l11-7z"/></svg></button>
        <button id="bEnd" aria-label="Til slutt"><svg viewBox="0 0 24 24"><path d="M4 5v14l11-7zM16 5h2v14h-2z"/></svg></button>
      </div>
      <div class="scrubrow"><input type="range" id="scrub" min="0" max="0" value="0" aria-label="Steg"><span class="count" id="count"></span></div>
      <div class="warn" id="warn"></div>
    </section>
    <aside class="side">
      <div class="box"><h2>Handlinger</h2><ol id="log"></ol></div>
      <div class="box">
        <h2>Dele</h2>
        <label class="chk"><input type="checkbox" id="anon" checked> Skjul navn (vis posisjoner)</label>
        <label class="chk"><input type="checkbox" id="bbmode"> Vis beløp i BB</label>
        <div class="row"><button class="primary" id="bShare">Kopier delingslenke</button></div>
        <input id="shareOut" readonly hidden aria-label="Delingslenke">
        <p class="hint" id="shareMsg">Lenken inneholder hele hånden. Med «Skjul navn» på erstattes alle navn med posisjoner før lenken lages.</p>
      </div>
      <details class="box" id="importBox" open>
        <summary>Lim inn hånd</summary>
        <textarea id="hh" spellcheck="false" aria-label="Håndhistorikk" placeholder="Lim inn håndhistorikk fra Epicbet her, eller en delingslenke."></textarea>
        <div class="row"><button class="primary" id="bLoad">Vis hånd</button><button id="bClear">Tøm</button></div>
        <p class="hint">Lim inn håndhistorikk fra Epicbet, eller en delingskode.</p>
        <div class="err" id="err"></div>
      </details>
    </aside>
  </div>
</div>

<script>
const ARTIFACT_URL = location.origin + location.pathname;
const SUIT = {s:'♠',h:'♥',d:'♦',c:'♣'};
const STREET = ['Preflop','Flop','Turn','River'];

/* ---------- parsing ---------- */
function num(s){ s=String(s||'').trim(); if(s.includes(',')&&!s.includes('.')) s=s.replace(',','.'); else s=s.replace(/,/g,''); return parseFloat(s)||0; }
function parseCard(t){
  const u=t.trim().toUpperCase(); let s,r;
  if(/^[SHDC](10|[2-9TJQKA])$/.test(u)){ s=u[0]; r=u.slice(1); }
  else if(/^(10|[2-9TJQKA])[SHDC]$/.test(u)){ s=u.slice(-1); r=u.slice(0,-1); }
  else return null;
  if(r==='10') r='T';
  return r+s.toLowerCase();
}
function parseCards(str){ return String(str||'').split(/[\s,]+/).map(parseCard).filter(Boolean); }

function parse(text){
  const L=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const h={c:'',sb:0,bb:0,g:"Hold'em",p:[],hero:-1,hc:[],a:[],bd:[[],[],[]],sh:[],w:[],co:[],tp:null,rk:null,an:0};
  let sec=-1; // -1 before hole cards, 0..3 streets, 9 summary
  const idx=n=>h.p.findIndex(p=>p.n===n);
  for(const l of L){
    let m;
    if(!h.bb && (m=l.match(/(Texas Hold'?em|Hold'?em|Omaha[^€$£\d]*?)\s+(NL|PL|FL|LHE)?\s*([€$£])\s*([\d.,]+)\s*\/\s*[€$£]?\s*([\d.,]+)/i))){
      h.g=((m[2]||'')+' '+m[1].replace(/^Texas\s+/i,'')).trim(); h.c=m[3]; h.sb=num(m[4]); h.bb=num(m[5]); continue;
    }
    if(!h.bb && (m=l.match(/Blinds:\s*[€$£]?([\d.,]+)\s*\/\s*[€$£]?([\d.,]+)/i))){ h.sb=num(m[1]); h.bb=num(m[2]); }
    if(sec<0 && (m=l.match(/^Seat\s+(\d+):\s+(.+?)\s+\(\s*([€$£]?)\s*([\d.,]+)\s+in chips\)(.*)$/i))){
      if(m[3]&&!h.c) h.c=m[3]; m=[m[0],m[1],m[2],m[4],m[5]];
      h.p.push({n:m[2],st:num(m[3]),d:/DEALER|button/i.test(m[4])}); continue;
    }
    if(/^\*\*\*\s*HOLE CARDS/i.test(l)){ sec=0; continue; }
    if((m=l.match(/^\*\*\*\s*(FLOP|TURN|RIVER)\s*\*\*\*(.*)$/i))){
      const br=[...m[2].matchAll(/\[([^\]]*)\]/g)].map(x=>parseCards(x[1]));
      const st={FLOP:1,TURN:2,RIVER:3}[m[1].toUpperCase()];
      if(br.length){ if(st===1) h.bd[0]=br[0].slice(0,3); else { const last=br[br.length-1]; h.bd[st-1]=last.slice(-1); } }
      sec=st; continue;
    }
    if(/^\*\*\*\s*(SUMMARY|SHOW ?DOWN)/i.test(l)){ sec=9; }
    if((m=l.match(/Total pot\s*[€$£]?\s*([\d.,]+)/i))){ h.tp=num(m[1]); const r=l.match(/Rake\s*[€$£]?\s*([\d.,]+)/i); if(r) h.rk=num(r[1]); continue; }
    if((m=l.match(/^Dealt to\s+(.+?)\s*\[(.+?)\]/i))){ h.hero=idx(m[1]); h.hc=parseCards(m[2]); continue; }
    if((m=l.match(/^(.+?):\s*Posts?\s+(?:(SB|BB|small blind|big blind|ante|straddle|dead)\s*)?[€$£]?\s*([\d.,]+)/i))){
      const i=idx(m[1]); if(i>=0) h.a.push({s:0,p:i,t:'post',x:num(m[3]),k:(m[2]||'').toUpperCase()}); continue;
    }
    if((m=l.match(/^(.+?):\s*Shows\s*\[(.+?)\]\s*(.*)$/i))){ const i=idx(m[1]); if(i>=0) h.sh.push({p:i,cards:parseCards(m[2]),desc:m[3].trim()}); continue; }
    if((m=l.match(/^(.+?):\s*(?:wins|collected)\s*[€$£]?\s*([\d.,]+)/i))){ const i=idx(m[1]); if(i>=0) h.w.push({p:i,x:num(m[2])}); continue; }
    if((m=l.match(/^(.+?):\s*cashed out\s*[€$£]?\s*([\d.,]+)/i))){ const i=idx(m[1]); if(i>=0) h.co.push({p:i,x:num(m[2])}); continue; }
    if(sec>=0 && sec<=3 && (m=l.match(/^(.+?):\s*(Folds?|Checks?|Calls?|Bets?|Raises?|All-?in)\b(?:\s*\([^)]*\))?\s*(?:[€$£]\s*)?([\d.,]+)?(.*)$/i))){
      const i=idx(m[1]); if(i<0) continue;
      const w=m[2].toLowerCase(); const t=w.startsWith('f')?'f':w.startsWith('ch')?'k':w.startsWith('ca')?'c':w.startsWith('b')?'b':w.startsWith('r')?'r':'a';
      let x=num(m[3]); const to=(m[4]||'').match(/to\s*[€$£]?\s*([\d.,]+)/i); if(t==='r'&&to) x=num(to[1]);
      h.a.push({s:sec,p:i,t,x});
    }
  }
  if(h.p.length<2) throw new Error('Fant ikke spillerne. Lim inn hele håndhistorikken, fra GAME-linjen til slutten.');
  if(!h.a.some(a=>a.t!=='post')) throw new Error('Fant ingen handlinger i hånden.');
  return h;
}

/* ---------- positions & names ---------- */
const POSN={2:['BTN','BB'],3:['BTN','SB','BB'],4:['BTN','SB','BB','CO'],5:['BTN','SB','BB','UTG','CO'],6:['BTN','SB','BB','UTG','HJ','CO'],
  7:['BTN','SB','BB','UTG','MP','HJ','CO'],8:['BTN','SB','BB','UTG','UTG+1','MP','HJ','CO'],9:['BTN','SB','BB','UTG','UTG+1','MP','LJ','HJ','CO'],
  10:['BTN','SB','BB','UTG','UTG+1','UTG+2','MP','LJ','HJ','CO']};
function positions(h){
  const n=h.p.length; let di=h.p.findIndex(p=>p.d);
  if(di<0){ const sb=h.a.find(a=>a.t==='post'&&a.k==='SB'); di=sb? (n===2? sb.p : (sb.p-1+n)%n) : -1; }
  const out=h.p.map((_,i)=>'P'+(i+1)); if(di<0) return out;
  const lab=POSN[n]||[]; for(let k=0;k<n;k++) out[(di+k)%n]=lab[k]||('P'+(k+1)); return out;
}

/* ---------- share codes ---------- */
const A32='abcdefghijklmnopqrstuvwxyz234567';
function b32(bytes){ let o='',bits=0,v=0; for(const b of bytes){ v=(v<<8)|b; bits+=8; while(bits>=5){ o+=A32[(v>>>(bits-5))&31]; bits-=5; } v&=(1<<bits)-1; } if(bits>0) o+=A32[(v<<(5-bits))&31]; return o; }
function unb32(s){ let bits=0,v=0; const o=[]; for(const ch of s){ const x=A32.indexOf(ch); if(x<0) throw new Error('Ugyldig kode'); v=(v<<5)|x; bits+=5; if(bits>=8){ o.push((v>>>(bits-8))&255); bits-=8; } v&=(1<<bits)-1; } return new Uint8Array(o); }
async function pipe(bytes,stream){ const s=new Blob([bytes]).stream().pipeThrough(stream); return new Uint8Array(await new Response(s).arrayBuffer()); }
function pack(h,anon){
  const pos=positions(h);
  return {v:1,c:h.c,g:h.g,b:[h.sb,h.bb],p:h.p.map((p,i)=>[anon?(i===h.hero?'Hero':pos[i]):p.n,p.st,p.d?1:0]),h:h.hero,hc:h.hc.join(''),
    a:h.a.map(a=>[a.s,a.p,a.t,a.x||0,a.k||'']),bd:h.bd.map(x=>x.join('')),sh:h.sh.map(s=>[s.p,s.cards.join(''),s.desc]),
    w:h.w.map(x=>[x.p,x.x]),co:h.co.map(x=>[x.p,x.x]),tp:h.tp,rk:h.rk,an:anon?1:0};
}
const split2=s=>(String(s||'').match(/.{2}/g)||[]);
function unpack(o){
  return {c:o.c,g:o.g,sb:o.b[0],bb:o.b[1],p:o.p.map(x=>({n:x[0],st:x[1],d:!!x[2]})),hero:o.h,hc:split2(o.hc),
    a:o.a.map(x=>({s:x[0],p:x[1],t:x[2],x:x[3],k:x[4]})),bd:o.bd.map(split2),sh:o.sh.map(x=>({p:x[0],cards:split2(x[1]),desc:x[2]})),
    w:o.w.map(x=>({p:x[0],x:x[1]})),co:o.co.map(x=>({p:x[0],x:x[1]})),tp:o.tp,rk:o.rk,an:o.an};
}
async function encode(h,anon){
  const raw=new TextEncoder().encode(JSON.stringify(pack(h,anon)));
  if(typeof CompressionStream!=='undefined'){ try{ return 'z'+b32(await pipe(raw,new CompressionStream('deflate-raw'))); }catch(e){} }
  return 'j'+b32(raw);
}
async function decode(code){
  code=code.trim().replace(/^.*#/,'').toLowerCase();
  let bytes=unb32(code.slice(1));
  if(code[0]==='z') bytes=await pipe(bytes,new DecompressionStream('deflate-raw'));
  else if(code[0]!=='j') throw new Error('Ugyldig kode');
  return unpack(JSON.parse(new TextDecoder().decode(bytes)));
}

/* ---------- engine: hand -> steps ---------- */
const r2=x=>Math.round(x*100)/100;
function build(h){
  const P=h.p.map(p=>({st:p.st,bet:0,tot:0,f:false,ai:false,act:null,sc:null,desc:'',won:0,co:0}));
  let pot=0,cur=0; const board=[],steps=[];
  const snap=(t,o={})=>steps.push({t,actor:o.actor??-1,street:cur,kind:o.kind||'act',type:o.type||'',add:o.add||0,pot:r2(pot),board:[...board],P:P.map(q=>({...q})),res:o.res||null});
  const put=(q,x)=>{ x=Math.max(0,Math.min(x,q.st)); q.st=r2(q.st-x); q.bet=r2(q.bet+x); q.tot=r2(q.tot+x); if(q.st<=0.004){q.st=0;q.ai=true;} return x; };
  for(const a of h.a.filter(a=>a.t==='post')){ const q=P[a.p];
    if(/ANTE|DEAD/i.test(a.k||'')){ const x=Math.min(a.x,q.st); q.st=r2(q.st-x); q.tot=r2(q.tot+x); pot=r2(pot+x); if(q.st<=0.004){q.st=0;q.ai=true;} continue; }
    put(q,a.x); q.act={k:a.k||'Post',x:q.bet,c:'post'}; }
  snap(()=>pot>0?`Blinds er lagt, ante ${M(pot)} i potten`:'Blinds er lagt',{kind:'start'});
  const collect=()=>{ pot=r2(pot+P.reduce((t,q)=>t+q.bet,0)); P.forEach(q=>{q.bet=0; if(!q.f) q.act=null;}); };
  const deal=s=>{ collect(); const c=h.bd[s-1]||[]; board.push(...c); cur=s; snap(()=>STREET[s]+(c.length?': '+c.map(cardTxt).join(' '):''),{kind:'street',type:'street'}); };
  const acts=h.a.filter(a=>a.t!=='post');
  acts.forEach((a,i)=>{
    while(cur<a.s) deal(cur+1);
    const q=P[a.p], p=a.p; let t, add=0, ty;
    if(a.t==='f'){ q.f=true; ty='fold'; q.act={k:'Fold',c:ty}; t=()=>`${N(p)} folder`; }
    else if(a.t==='k'){ ty='check'; q.act={k:'Check',c:ty}; t=()=>`${N(p)} sjekker`; }
    else if(a.t==='c'){ add=put(q,a.x); const ai=q.ai; ty=ai?'allin':'call'; q.act={k:ai?'All-in':'Call',x:q.bet,c:ty}; t=()=>`${N(p)} syner ${M(add)}${ai?' (all-in)':''}`; }
    else if(a.t==='b'){ add=put(q,a.x); const ai=q.ai; ty=ai?'allin':'bet'; q.act={k:ai?'All-in':'Bet',x:q.bet,c:ty}; t=()=>`${N(p)} better ${M(add)}${ai?' (all-in)':''}`; }
    else if(a.t==='r'){ add=put(q,a.x-q.bet); const to=q.bet, ai=q.ai; ty=ai?'allin':'raise'; q.act={k:ai?'All-in':'Raise',x:to,c:ty}; t=()=>`${N(p)} raiser til ${M(to)}${ai?' (all-in)':''}`; }
    else { add=put(q,a.x); q.ai=true; const to=q.bet; ty='allin'; q.act={k:'All-in',x:to,c:ty}; t=()=>`${N(p)} er all-in, ${M(to)} totalt`; }
    snap(t,{actor:p,type:ty,add});
    if(i===acts.length-1){
      let mx=0; P.forEach((q,j)=>{ if(q.tot>P[mx].tot) mx=j; });
      const second=Math.max(0,...P.filter((_,j)=>j!==mx).map(q=>q.tot));
      const d=r2(P[mx].tot-second);
      if(d>0.004){ const m=P[mx]; m.bet=r2(m.bet-d); m.tot=r2(m.tot-d); m.st=r2(m.st+d); if(m.act&&m.act.x!=null) m.act={...m.act,x:m.bet};
        snap(()=>`${M(d)} ikke synt, tilbake til ${N(mx)}`,{actor:mx,kind:'return',type:'return'}); }
    }
  });
  if(P.filter(q=>!q.f).length>1) for(let s=cur+1;s<=3;s++) if((h.bd[s-1]||[]).length) deal(s);
  collect();
  if(h.sh.length){ h.sh.forEach(s=>{ P[s.p].sc=s.cards; P[s.p].desc=s.desc; }); snap(()=>'Showdown',{kind:'show'}); }
  const total=pot;
  h.w.forEach(w=>{ P[w.p].st=r2(P[w.p].st+w.x); P[w.p].won=w.x; P[w.p].act={k:'Vinner',x:w.x,c:'win'}; });
  h.co.forEach(c=>{ P[c.p].co=c.x; P[c.p].st=r2(P[c.p].st+c.x); });
  pot=0;
  const res={w:h.w,co:h.co,rk:h.rk,total};
  snap(()=>[...h.w.map(w=>`${N(w.p)} vinner ${M(w.x)}`),...h.co.map(c=>`${N(c.p)} cashet ut ${M(c.x)}`)].join(' · ')||'Ferdig',{kind:'result',type:'win',res});
  const warn=(h.tp!=null && Math.abs(h.tp-total)>0.02)?`Beregnet pott (${total}) avviker fra historikken (${h.tp}).`:'';
  return {steps,warn};
}

const $=id=>document.getElementById(id);
const opt={anon:true,bb:false};
function N(j){ if(!H) return ''; if(opt.anon && !H.an) return j===H.hero?'Hero':pos[j]; return H.p[j].n; }
function isChips(){ return !!H && (!H.c || (H.bb>=1000 && Number.isInteger(H.bb) && Number.isInteger(H.sb))); }
function fmt(x){ return isChips() ? Math.round(x).toLocaleString('nb-NO') : (H?H.c:'€')+Number(x).toFixed(2); }
function M(x){ if(opt.bb && H && H.bb) return (Math.round(x/H.bb*10)/10).toString()+' BB'; return fmt(x); }
function cardTxt(c){ return c[0].replace('T','10')+SUIT[c[1]]; }
function cardEl(c,cls=''){ const e=document.createElement('div');
  if(!c){ e.className='card '+(cls||'back'); return e; }
  e.className='card '+c[1]; e.setAttribute('aria-label',cardTxt(c));
  e.innerHTML=`<span>${c[0]==='T'?'10':c[0]}</span><span>${SUIT[c[1]]}</span>`; return e; }

let seatEls=[], betEls=[], dEl=null;
function setupTable(){
  const tb=$('table'); tb.querySelectorAll('.seat,.betpos,.dbtn').forEach(e=>e.remove());
  seatEls=H.p.map((_,j)=>{ const s=document.createElement('div'); s.className='seat'+(j===H.hero?' hero':'');
    s.innerHTML='<div class="hole"></div><div class="plate"><div class="name"></div><div class="stack"></div></div><div class="tag"></div><div class="desc"></div>'; tb.appendChild(s); return s; });
  betEls=H.p.map(()=>{ const b=document.createElement('div'); b.className='betpos'; b.innerHTML='<div class="chips"></div><span></span>'; b.hidden=true; tb.appendChild(b); return b; });
  dEl=document.createElement('div'); dEl.className='dbtn'; dEl.textContent='D'; tb.appendChild(dEl);
  layout();
}
function layout(){
  if(!H) return; const tb=$('table'); const portrait=tb.clientHeight>tb.clientWidth;
  const n=H.p.length, base=H.hero>=0?H.hero:0, rx=portrait?37:41, ry=portrait?41:38;
  const di=H.p.findIndex(p=>p.d);
  for(let j=0;j<n;j++){
    const k=(j-base+n)%n, th=Math.PI/2+k*2*Math.PI/n, cx=Math.cos(th), cy=Math.sin(th);
    Object.assign(seatEls[j].style,{left:(50+rx*cx)+'%',top:(50+ry*cy)+'%'});
    Object.assign(betEls[j].style,{left:(50+rx*.56*cx)+'%',top:(50+ry*.5*cy+(cy>0?-2:2))+'%'});
    if(j===di){ const t2=th-0.33; Object.assign(dEl.style,{left:(50+rx*.74*Math.cos(t2))+'%',top:(50+ry*.7*Math.sin(t2))+'%'}); }
  }
  dEl.hidden=di<0;
}

function render(){
  if(!H||!S.length) return;
  const st=S[i];
  st.P.forEach((q,j)=>{
    const s=seatEls[j]; s.classList.toggle('folded',q.f); s.classList.toggle('active',st.actor===j);
    s.querySelector('.name').textContent=N(j);
    const showPos=!(opt.anon && !H.an);
    s.querySelector('.stack').innerHTML=(showPos?`<span class="pos">${pos[j]}</span>`:'')+(q.co&&st.kind==='result'?`${M(q.st)} <span class="pos">inkl. cash out</span>`:M(q.st)+(q.ai&&!q.f&&q.st===0?' <span class="pos">all-in</span>':''));
    const hole=s.querySelector('.hole'); hole.textContent='';
    let cards=null; if(j===H.hero) cards=H.hc; if(q.sc) cards=q.sc;
    if(!q.f){ if(cards&&cards.length) cards.forEach(c=>hole.appendChild(cardEl(c))); else { hole.appendChild(cardEl(null)); hole.appendChild(cardEl(null)); } }
    const tag=s.querySelector('.tag'); tag.className='tag'; tag.textContent='';
    if(st.kind==='result' && q.co){ tag.textContent='Cash out '+M(q.co); tag.classList.add('win'); }
    else if(q.act){ tag.textContent=q.act.k+(q.act.x!=null&&q.act.c!=='fold'?' '+M(q.act.x):''); tag.classList.add(q.act.c); }
    if(st.actor===j && st.kind==='act' && animOK()) tag.animate([{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:320,easing:'cubic-bezier(.2,.9,.3,1.3)'});
    s.querySelector('.desc').textContent=q.desc||'';
    const b=betEls[j]; b.hidden=!(q.bet>0); b.querySelector('span').textContent=M(q.bet);
    b.className='betpos '+((q.act&&q.act.c)||'post'); b.querySelector('.chips').innerHTML=chipHTML(q.bet);
  });
  const bets=st.P.reduce((t,q)=>t+q.bet,0);
  $('pot').textContent=st.kind==='result'?'Pott '+M(st.res.total):'Pott '+M(st.pot)+(bets>0?' · totalt '+M(r2(st.pot+bets)):'');
  const bd=$('board'); bd.textContent=''; for(let k=0;k<5;k++) bd.appendChild(st.board[k]?cardEl(st.board[k]):cardEl(null,'empty'));
  const r=$('result');
  if(st.kind==='result'){ const x=st.res; r.innerHTML=[...x.w.map(w=>`<b>${esc(N(w.p))}</b> vinner ${M(w.x)}`),...x.co.map(c=>`${esc(N(c.p))} cashet ut ${M(c.x)}`),x.rk!=null?`Rake ${M(x.rk)}`:''].filter(Boolean).join('<br>'); }
  else r.innerHTML='';
  tb_clearFly();
  const LBL={check:'Check',call:'Call',bet:'Bet',raise:'Raise',allin:'All-in',fold:'Fold',win:'Resultat',street:STREET[st.street],return:'Retur'};
  const nb=$('narr'); nb.textContent='';
  if(st.type&&LBL[st.type]){ const v=document.createElement('span'); v.className='vb '+st.type; v.textContent=LBL[st.type]; nb.appendChild(v); }
  const tx=document.createElement('span'); tx.textContent=st.t(); nb.appendChild(tx);
  const n2=$('narr2'); const totNow=r2(st.pot+bets);
  if(st.kind==='act'&&st.add>0) n2.innerHTML=`<span class="plus">+${esc(M(st.add))}</span> i potten · totalt ${esc(M(totNow))}`;
  else if(st.kind==='act'&&st.type==='check') n2.textContent=`Ingen penger inn · totalt ${M(totNow)}`;
  else if(st.kind==='act'&&st.type==='fold') n2.textContent=`Gir opp ${M(st.P[st.actor].tot)} · totalt ${M(totNow)}`;
  else if(st.kind==='result') n2.textContent=st.res.rk!=null?`Pott ${M(st.res.total)} · rake ${M(st.res.rk)}`:`Pott ${M(st.res.total)}`;
  else n2.textContent=`Pott ${M(totNow)}`;
  $('scrub').value=i; $('count').textContent=`${i+1} / ${S.length}`;
  [...$('log').querySelectorAll('li.step')].forEach(li=>li.classList.toggle('cur',+li.dataset.i===i));
  const curLi=$('log').querySelector('li.cur'); if(curLi){ const lg=$('log'); const top=curLi.offsetTop-lg.offsetTop; if(top<lg.scrollTop||top>lg.scrollTop+lg.clientHeight-30) lg.scrollTop=top-60; }
}
function tb_clearFly(){ /* flying chips clean themselves up */ }
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderLog(){
  const lg=$('log'); lg.textContent=''; let last=-1;
  S.forEach((st,k)=>{
    if(st.street!==last && st.kind!=='street'){ /* header printed by street step */ }
    if(k===0||st.kind==='street'||st.kind==='show'||st.kind==='result'){
      const hd=document.createElement('li'); hd.className='st';
      hd.textContent=k===0?'Preflop':st.kind==='street'?STREET[st.street]:st.kind==='show'?'Showdown':'Resultat'; lg.appendChild(hd);
    }
    const li=document.createElement('li'); li.className='step'; li.dataset.i=k; li.tabIndex=0;
    if(st.kind==='act'&&st.type){ const b=document.createElement('span'); b.className='lb '+st.type; b.textContent={check:'Check',call:'Call',bet:'Bet',raise:'Raise',allin:'All-in',fold:'Fold'}[st.type]; li.appendChild(b); }
    li.appendChild(document.createTextNode(st.t()));
    li.onclick=()=>go(k); li.onkeydown=e=>{ if(e.key==='Enter') go(k); }; lg.appendChild(li); last=st.street;
  });

function meta(){ $('meta').textContent=`${H.g} · ${fmt(H.sb)}/${fmt(H.bb)} · ${H.p.length} spillere`; }
function load(h){
  H=h; pos=positions(h); const r=build(h); S=r.steps; i=0; stop();
  $('warn').textContent=r.warn; $('scrub').max=S.length-1;
  $('anon').disabled=!!h.an; if(h.an) $('anon').checked=true;
  setupTable(); meta(); renderLog(); render();
}
function chipHTML(x){ if(!(x>0)||!H) return ''; const n=Math.max(1,Math.min(6,Math.round(1+Math.log2(Math.max(1,x/H.bb))))); return '<b></b>'.repeat(n); }
function animOK(){ try{ return !matchMedia('(prefers-reduced-motion: reduce)').matches && !!Element.prototype.animate; }catch(e){ return false; } }
function flyChips(fromL,fromT,toL,toT,amount,cls,delay=0){
  const tb=$('table'); const f=document.createElement('div'); f.className='fly betpos '+cls;
  f.innerHTML=`<div class="chips">${chipHTML(amount)}</div>`; f.style.left=toL; f.style.top=toT; tb.appendChild(f);
  const a=f.animate([{left:fromL,top:fromT,opacity:1},{left:toL,top:toT,opacity:1,offset:.85},{left:toL,top:toT,opacity:0}],{duration:520,delay,easing:'cubic-bezier(.3,.7,.3,1)',fill:'both'});
  a.onfinish=()=>f.remove(); a.oncancel=()=>f.remove();
}
const POT_L='50%', POT_T='44%';
function animateStep(prev,st){
  if(!animOK()) return;
  if(st.kind==='act' && st.add>0 && st.actor>=0){
    const b=betEls[st.actor], s=seatEls[st.actor];
    b.animate([{left:s.style.left,top:s.style.top,opacity:.2},{left:b.style.left,top:b.style.top,opacity:1}],{duration:380,easing:'cubic-bezier(.2,.8,.3,1)'});
  }
  if((st.kind==='street'||st.kind==='show'||st.kind==='result') && prev){
    prev.P.forEach((q,j)=>{ if(q.bet>0) flyChips(betEls[j].style.left,betEls[j].style.top,POT_L,POT_T,q.bet,(q.act&&q.act.c)||'post'); });
  }
  if(st.kind==='result'){
    st.res.w.forEach(w=>flyChips(POT_L,POT_T,seatEls[w.p].style.left,seatEls[w.p].style.top,w.x,'win',250));
  }
  const potGrew=(st.kind!=='act')&&prev&&prev.P.some(q=>q.bet>0);
  if(potGrew) $('pot').animate([{transform:'scale(1)'},{transform:'scale(1.18)'},{transform:'scale(1)'}],{duration:420,delay:350});
}
function go(k){ k=Math.max(0,Math.min(S.length-1,k)); const prev=S[i], fwd=(k===i+1); i=k; render(); if(fwd) animateStep(prev,S[i]); }
function emptyState(){
  H=null; S=[]; i=0; const tb=$('table'); tb.querySelectorAll('.seat,.betpos,.dbtn,.fly').forEach(e=>e.remove());
  $('pot').textContent=''; const bd=$('board'); bd.textContent=''; for(let k=0;k<5;k++) bd.appendChild(cardEl(null,'empty'));
  $('result').innerHTML='<div class="empty-msg">Lim inn en håndhistorikk eller en delingslenke for å starte</div>';
  $('narr').textContent='Ingen hånd lastet'; $('narr2').textContent=''; $('count').textContent=''; $('scrub').max=0; $('meta').textContent=''; $('log').textContent='';
  $('importBox').open=true;
}
function stop(){ if(timer){ clearInterval(timer); timer=null; } $('playTxt').textContent='Spill av'; $('playIco').innerHTML='<path d="M7 5v14l12-7z"/>'; }
function play(){ if(!S.length) return; if(timer){ stop(); return; } if(i>=S.length-1) i=0; render();
  $('playTxt').textContent='Pause'; $('playIco').innerHTML='<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
  timer=setInterval(()=>{ if(i>=S.length-1){ stop(); return; } go(i+1); },1100); }

async function tryLoad(text){
  $('err').textContent='';
  try{
    const t=text.trim();
    if(/^[zj][a-z2-7]{20,}$/i.test(t.replace(/^.*#/,''))&&!/\s/.test(t)){ load(await decode(t)); }
    else load(parse(t));
    return true;
  }catch(e){ $('err').textContent=e.message||'Kunne ikke lese hånden.'; return false; }
}
let lastCode='';
async function share(){
  if(!H) return;
  const code=await encode(H,$('anon').checked); lastCode=code;
  try{ location.hash=code; }catch(e){}
  const link=ARTIFACT_URL?ARTIFACT_URL+'#'+code:'';
  const out=$('shareOut'); out.hidden=false; out.value=link||code;
  let ok=false; try{ await navigator.clipboard.writeText(link||code); ok=true; }catch(e){ out.focus(); out.select(); }
  $('shareMsg').textContent=link?(ok?'Lenken er kopiert.':'Marker og kopier lenken over.'):(ok?'Koden er kopiert. Mottakeren limer den inn under «Lim inn hånd».':'Marker og kopier koden over.');
}

function init(){
  try{ const sv=JSON.parse(localStorage.getItem('hr-opt')||'{}'); if(typeof sv.anon==='boolean') opt.anon=sv.anon; if(typeof sv.bb==='boolean') opt.bb=sv.bb; }catch(e){}
  $('anon').checked=opt.anon; $('bbmode').checked=opt.bb;
  const saveOpt=()=>{ try{ localStorage.setItem('hr-opt',JSON.stringify(opt)); }catch(e){} };
  $('anon').onchange=e=>{ opt.anon=e.target.checked; saveOpt(); renderLog(); render(); };
  $('bbmode').onchange=e=>{ opt.bb=e.target.checked; saveOpt(); renderLog(); render(); };
  $('bStart').onclick=()=>{ stop(); go(0); }; $('bEnd').onclick=()=>{ stop(); go(S.length-1); };
  $('bPrev').onclick=()=>{ stop(); go(i-1); }; $('bNext').onclick=()=>{ stop(); go(i+1); };
  $('bPlay').onclick=play; $('scrub').oninput=e=>{ stop(); go(+e.target.value); };
  $('bLoad').onclick=async()=>{ if(await tryLoad($('hh').value)){ $('sharedBadge').hidden=true; $('shareOut').hidden=true; } };
  $('bClear').onclick=()=>{ $('hh').value=''; $('hh').focus(); };
  $('bShare').onclick=share;
  document.addEventListener('keydown',e=>{ if(/INPUT|TEXTAREA|BUTTON|SUMMARY/.test(e.target.tagName)&&e.target.type!=='range') return;
    if(e.key==='ArrowRight'){ stop(); go(i+1); e.preventDefault(); } else if(e.key==='ArrowLeft'){ stop(); go(i-1); e.preventDefault(); }
    else if(e.key===' '){ play(); e.preventDefault(); } else if(e.key==='Home'){ stop(); go(0); } else if(e.key==='End'){ stop(); go(S.length-1); } });
  if('ResizeObserver' in window) new ResizeObserver(()=>layout()).observe($('table'));
  const fromHash=async()=>{ const hsh=decodeURIComponent(location.hash.slice(1)); if(!hsh||hsh===lastCode) return false;
    try{ load(await decode(hsh)); lastCode=hsh; $('sharedBadge').hidden=false; $('importBox').open=false; return true; }catch(e){ $('err').textContent='Delingslenken kunne ikke leses.'; return false; } };
  window.addEventListener('hashchange',fromHash);
  fromHash().then(ok=>{ if(!ok) emptyState(); });
}
if(typeof document!=='undefined') init();
if(typeof module!=='undefined') module.exports={parse,build,encode,decode,positions,setH:(h)=>{H=h;pos=positions(h);}};
</script>
